name: Actualizar datos SUNARP

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl==3.1.5

      - name: Descargar y convertir xlsx de SUNARP
        run: python scripts/sunarp_a_json.py

      - name: Guardar cambios si los hay
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data/sunarp
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos SUNARP actualizados"
            git push
          fi
